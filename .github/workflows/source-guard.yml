name: Source guard
on:
  push:
  pull_request:
jobs:
  source-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: self-test
        run: python3 .github/scripts/source_guard.py --self-test
      - name: scan
        run: python3 .github/scripts/source_guard.py .
