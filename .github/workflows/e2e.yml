name: E2E (Playwright + backend)
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true
jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Start backend
        run: |
          docker compose up -d --build backend
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8002/api/health > /dev/null; then exit 0; fi
            sleep 2
          done
          docker compose logs backend
          exit 1
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Build site with backend origin
        env:
          VITE_BACKEND_URL: http://127.0.0.1:8002
        run: npm run build
      - name: Run advanced e2e
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:4173/foil-cfd-site
          FOIL_API: http://127.0.0.1:8002
        run: |
          npx vite preview --port 4173 --strictPort --host 127.0.0.1 > /tmp/preview.log 2>&1 &
          PREVIEW_PID=$!
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/foil-cfd-site/ > /dev/null; then break; fi
            sleep 2
          done
          set +e
          npx playwright test tests/e2e/foil-advanced.spec.ts --project=desktop-chrome --retries=1 --workers=1
          rc=$?
          kill "$PREVIEW_PID" 2>/dev/null || true
          cat /tmp/preview.log
          exit $rc
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7
      - name: Stop backend
        if: always()
        run: docker compose down
