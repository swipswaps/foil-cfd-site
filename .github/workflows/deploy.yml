name: CI / Deploy to GitHub Pages
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: node scripts/check-bundle-budget.mjs
      - if: github.event_name != 'pull_request'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: dist
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm run typecheck
      - run: python3 -m py_compile backend/main.py backend/cfd_analysis.py backend/job_retention.py
      - run: python3 backend/test_job_retention.py
      - name: Start backend
        run: |
          docker compose up -d --build backend
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8002/api/health > /dev/null; then exit 0; fi
            sleep 2
          done
          docker compose logs backend
          exit 1
      - name: Assert local-network CORS header (PNA)
        run: |
          curl -fsS -X OPTIONS \
            -H 'Origin: https://swipswaps.github.io' \
            -H 'Access-Control-Request-Method: GET' \
            -H 'Access-Control-Request-Private-Network: true' \
            -D - -o /dev/null http://127.0.0.1:8002/api/health \
            | grep -i 'access-control-allow-private-network: true'
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Build site with backend origin
        env:
          VITE_BACKEND_URL: http://127.0.0.1:8002
        run: npm run build
      - name: Run advanced e2e
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:4173/foil-cfd-site
          FOIL_API: http://127.0.0.1:8002
        run: |
          npx vite preview --port 4173 --strictPort --host 127.0.0.1 > /tmp/preview.log 2>&1 &
          PREVIEW_PID=$!
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/foil-cfd-site/ > /dev/null; then break; fi
            sleep 2
          done
          set +e
          npx playwright test tests/e2e/foil-advanced.spec.ts tests/e2e/foil-components.spec.ts --project=desktop-chrome --retries=1 --workers=1
          rc=$?
          kill "$PREVIEW_PID" 2>/dev/null || true
          cat /tmp/preview.log
          exit $rc
      - name: Static demo e2e (no backend)
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:4175/foil-cfd-site
        run: |
          npm run build
          npx vite preview --port 4175 --strictPort --host 127.0.0.1 > /tmp/preview-static.log 2>&1 &
          PREVIEW_PID=$!
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4175/foil-cfd-site/ > /dev/null; then break; fi
            sleep 2
          done
          set +e
          npx playwright test tests/e2e/foil-static.spec.ts tests/e2e/foil-ux.spec.ts tests/e2e/foil-offline.spec.ts tests/e2e/foil-components.spec.ts tests/e2e/foil-a11y.spec.ts --project=desktop-chrome --retries=1 --workers=1
          rc=$?
          kill "$PREVIEW_PID" 2>/dev/null || true
          cat /tmp/preview-static.log
          exit $rc
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7
      - name: Stop backend
        if: always()
        run: docker compose down
  deploy:
    needs: [build, e2e]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
