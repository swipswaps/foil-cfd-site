<!doctype html>
<html lang="en" data-template="minimal">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="FOIL.CFD — CFD, CAD, and 3D tools for engineering research."
    />
    <meta name="theme-color" content="#06121A" />
    <title>FOIL.CFD</title>
    <script>
      // Set the template attribute before first paint to prevent FOUC.
      (function () {
        try {
          var saved = localStorage.getItem('foil-cfd-template');
          var t = saved === 'cinematic' || saved === 'grid' ? saved : 'minimal';
          document.documentElement.setAttribute('data-template', t);
        } catch (e) {
          document.documentElement.setAttribute('data-template', 'minimal');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
