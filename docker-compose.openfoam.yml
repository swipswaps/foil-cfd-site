services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.openfoam
    image: foil-cfd-site-backend:openfoam
    container_name: foil-cfd-site-backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8002:8000"
      - "100.119.125.16:8002:8000"
    volumes:
      - ./backend/jobs:/app/jobs
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
